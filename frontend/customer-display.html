<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KavachQR | Scan to Pay</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101817; color: #f4f0df; }
    main { width: min(92vw, 440px); text-align: center; padding: 36px 24px; }
    h1 { margin: 0; color: #e7bd58; letter-spacing: .08em; font-size: 2rem; }
    h2 { font-size: 1.1rem; font-weight: 400; margin: 10px 0 28px; color: #c5c9b8; }
    #qr { display: grid; place-items: center; min-height: 280px; background: #fff; border: 8px solid #fff; }
    #qr img { width: 100%; max-width: 280px; image-rendering: pixelated; }
    .amount { font-size: 2rem; margin: 28px 0 12px; }
    .window, #status { color: #c5c9b8; }
    #status { margin-top: 18px; }
    .alert { color: #f07e6e; }
  </style>
</head>
<body>
  <main>
    <h1>KAVACHQR</h1>
    <h2>Scan to Pay</h2>
    <div id="qr"><span>Loading secure session...</span></div>
    <div class="amount" id="amount">Amount: --</div>
    <div class="window" id="window">Security Window: -- seconds</div>
    <div id="status">Waiting for payment...</div>
  </main>
  <script>
    const API_BASE = window.KAVACH_API_BASE || localStorage.getItem('KAVACH_API_BASE') || 'http://localhost:8000';
    let sessionId = new URLSearchParams(location.search).get('session_id');
    let timer;
    async function loadSession() {
      if (!sessionId) throw new Error('Open this display from a merchant-created session.');
      const response = await fetch(`${API_BASE}/customer/session/${encodeURIComponent(sessionId)}`);
      if (!response.ok) throw new Error((await response.json()).detail || 'Unable to load payment session');
      const session = await response.json();
      document.getElementById('amount').textContent = `Amount: ₹${Number(session.amount).toFixed(2)}`;
      document.getElementById('qr').innerHTML = `<img src="${API_BASE}/merchant/session/${sessionId}/qr" alt="Secure KavachQR payment QR">`;
      timer = setInterval(() => {
        const seconds = Math.max(0, Math.floor((new Date(session.expires_at).getTime() - Date.now()) / 1000));
        document.getElementById('window').textContent = `Security Window: ${seconds} seconds`;
        if (!seconds) { clearInterval(timer); followNextSession().catch(showError); }
      }, 1000);
    }
    async function followNextSession() {
      const response = await fetch(`${API_BASE}/customer/session/${encodeURIComponent(sessionId)}/next`);
      if (!response.ok) throw new Error('Waiting for the merchant dashboard to create a new session.');
      const next = await response.json();
      sessionId = next.session_id;
      history.replaceState(null, '', `?session_id=${encodeURIComponent(sessionId)}`);
      await loadSession();
    }
    function showError(error) { document.getElementById('status').textContent = error.message; document.getElementById('status').className = 'alert'; }
    loadSession().catch(showError);
  </script>
</body>
</html>
