<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KavachQR Customer Display</title>
    <style>
        :root { color-scheme: dark; font-family: Georgia, serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10191a; color: #f4f0df; }
        main { width: min(92vw, 620px); text-align: center; }
        .brand { color: #f3c969; letter-spacing: .18em; text-transform: uppercase; font: 700 14px Arial, sans-serif; }
        h1 { font-size: clamp(38px, 8vw, 72px); margin: 20px 0 8px; }
        .subtitle { color: #b8c2bc; font: 16px Arial, sans-serif; }
        #qr { width: min(72vw, 360px); aspect-ratio: 1; margin: 36px auto 24px; display: grid; place-items: center; background: #fff; border: 12px solid #fff; }
        #qr img { width: 100%; height: 100%; image-rendering: crisp-edges; }
        .timer { color: #f3c969; font: 700 22px Arial, sans-serif; }
        #status { margin-top: 24px; color: #b8c2bc; font: 15px Arial, sans-serif; }
        .verified { color: #8be0a5 !important; }
        .blocked { color: #ff9a8d !important; }
    </style>
</head>
<body>
<main>
    <div class="brand">KavachQR</div>
    <h1>Scan to Pay</h1>
    <div class="subtitle">Secure payment window</div>
    <div id="qr"><span>Waiting for QR...</span></div>
    <div id="amount" class="subtitle">Amount: --</div>
    <div class="timer" id="timer">Security Window: -- seconds</div>
    <div id="status">Waiting for payment...</div>
</main>
<script>
const API_BASE = window.KAVACH_CONFIG?.apiBase || `${location.protocol}//${location.hostname}:8000`;
const MERCHANT_ID = new URLSearchParams(location.search).get('merchant_id') || 'M1';
let sessionId = null;
let expiresAt = 0;
let socket = null;

function showStatus(text, className = '') {
    const status = document.getElementById('status');
    status.textContent = text;
    status.className = className;
}

async function loadSession() {
    const response = await fetch(`${API_BASE}/merchant_session/${MERCHANT_ID}`);
    const data = await response.json();
    sessionId = data.session_id;
    expiresAt = data.expires_at;
    document.getElementById('amount').textContent = data.amount > 0 ? `Amount: ₹${Number(data.amount).toFixed(2)}` : 'Amount: As entered in UPI';
    const qrResponse = await fetch(`${API_BASE}/generate_qr?merchant_id=${encodeURIComponent(MERCHANT_ID)}&amount=0`);
    const blob = await qrResponse.blob();
    const image = document.createElement('img');
    image.src = URL.createObjectURL(blob);
    image.alt = 'KavachQR secure payment QR';
    const qr = document.getElementById('qr');
    qr.replaceChildren(image);
    showStatus('Waiting for payment...');
}

function connectSocket() {
    const url = new URL(API_BASE);
    socket = new WebSocket(`${url.protocol === 'https:' ? 'wss:' : 'ws:'}//${url.host}/ws/merchant/${encodeURIComponent(MERCHANT_ID)}`);
    socket.onmessage = event => {
        const data = JSON.parse(event.data);
        if (data.session_id && data.session_id !== sessionId) return;
        if (data.event === 'PAYMENT_SETTLED') showStatus(`Payment Verified  ${Number(data.settled_amount).toFixed(2)}`, 'verified');
        if (data.event === 'SPOOF_BLOCKED') showStatus('Payment Blocked  Security verification failed.', 'blocked');
        if (data.event === 'SESSION_CREATED') loadSession().catch(() => showStatus('Unable to load secure session.'));
    };
    socket.onclose = () => setTimeout(connectSocket, 2000);
}

setInterval(() => {
    const remaining = Math.max(0, Math.ceil(expiresAt - Date.now() / 1000));
    document.getElementById('timer').textContent = `Security Window: ${remaining} seconds`;
    if (remaining === 0) loadSession().catch(() => showStatus('Waiting for secure session...'));
}, 1000);
loadSession().catch(() => showStatus('Unable to connect to KavachQR gateway.'));
connectSocket();
</script>
</body>
</html>
